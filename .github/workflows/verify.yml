name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm, wasm-gc, js]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: 0.10.19+bee578715
          core-version: 0.10.19+bee578715
      - run: moon update
      - run: moon fmt --check
      - run: moon info
      - run: git diff --exit-code -- '*.mbti'
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - run: moon run --target ${{ matrix.target }} examples/counter
      - run: moon run --target ${{ matrix.target }} examples/archive
      - run: moon run --target ${{ matrix.target }} examples/reorder
      - run: moon run --target ${{ matrix.target }} examples/exponential
      - run: moon -C integration run --target ${{ matrix.target }} consumer
      - if: matrix.target == 'wasm'
        run: moon run checks/replay.mbtx -- moon wasm
      - if: matrix.target == 'wasm'
        run: moon run checks/reorder.mbtx -- moon wasm
      - if: matrix.target == 'wasm'
        run: moon run checks/stream.mbtx -- moon wasm
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: 0.10.19+bee578715
          core-version: 0.10.19+bee578715
      - run: moon update
      - run: moon test --target native --deny-warn
      - run: moon run --target native examples/counter
      - run: moon run --target native examples/archive
      - run: moon run --target native examples/reorder
      - run: moon run --target native examples/exponential
      - run: moon -C integration run --target native consumer
      - run: moon run checks/replay.mbtx -- moon native
      - run: moon run checks/reorder.mbtx -- moon native
      - run: moon run checks/stream.mbtx -- moon native
      - run: moon run checks/package.mbtx -- moon native
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: 0.10.19+bee578715
          core-version: 0.10.19+bee578715
      - run: moon update
      - run: curl --fail --location --retry 3 --output collector.tar.gz https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.166.0/otelcol_0.166.0_linux_amd64.tar.gz
      - run: sha256sum --check checks/collector.sha256
      - run: tar -xzf collector.tar.gz otelcol
      - run: moon run checks/collector.mbtx -- ./otelcol
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: 0.10.19+bee578715
          core-version: 0.10.19+bee578715
      - run: moon update
      - run: curl --fail --location --retry 3 --output contrib.tar.gz https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.166.0/otelcol-contrib_0.166.0_linux_amd64.tar.gz
      - run: sha256sum --check checks/contrib.sha256
      - run: tar -xzf contrib.tar.gz otelcol-contrib
      - run: moon run checks/differential.mbtx -- ./otelcol-contrib
  package:
    needs: [portable, native, collector, differential]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: 0.10.19+bee578715
          core-version: 0.10.19+bee578715
      - run: moon update
      - run: moon run checks/package.mbtx
      - uses: actions/upload-artifact@v4
        with:
          name: metricstitch-0.4.0-source
          path: _build/publish/vivid-oi-metricstitch-0.4.0.zip
          if-no-files-found: error
